<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="640" viewBox="0 0 1240 640" role="img" aria-label="Mapping SDXL-Lightning and AnimateDiff-Lightning design ideas to Wan DMD2 progressive distillation">
  <defs>
    <style>
      .title{font:700 27px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;fill:#17202a}
      .sub{font:15px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;fill:#475467}
      .box{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}
      .sdxl{fill:#eff6ff;stroke:#2563eb;stroke-width:2}
      .video{fill:#fdf2f8;stroke:#db2777;stroke-width:2}
      .wan{fill:#ecfdf5;stroke:#059669;stroke-width:2}
      .warn{fill:#fffbeb;stroke:#d97706;stroke-width:2}
      .label{font:700 18px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;fill:#17202a}
      .body{font:14px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;fill:#344054}
      .small{font:12px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;fill:#667085}
      .arrow{stroke:#334155;stroke-width:2.6;fill:none;marker-end:url(#arrowhead)}
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#334155"/>
    </marker>
  </defs>
  <rect width="1240" height="640" fill="#ffffff"/>
  <text x="44" y="48" class="title">Lightning 系列对 Wan DMD2 渐进蒸馏的启发</text>
  <text x="44" y="78" class="sub">核心共同点：渐进压缩 step + 对抗性/分布级质量约束 + 独立 step checkpoint + 强训练稳定性。</text>

  <rect x="55" y="125" width="335" height="170" rx="12" class="sdxl"/>
  <text x="82" y="160" class="label">SDXL-Lightning</text>
  <text x="82" y="190" class="body">图像：progressive adversarial distillation</text>
  <text x="82" y="216" class="body">128 -> 32: MSE early stage</text>
  <text x="82" y="242" class="body">32 -> 8 -> 4 -> 2 -> 1: adversarial</text>
  <text x="82" y="268" class="small">目标：少步清晰度 + mode coverage 平衡</text>

  <rect x="452" y="125" width="335" height="170" rx="12" class="video"/>
  <text x="479" y="160" class="label">AnimateDiff-Lightning</text>
  <text x="479" y="190" class="body">视频：把 Lightning 方法迁移到 motion module</text>
  <text x="479" y="216" class="body">cross-model distillation</text>
  <text x="479" y="242" class="body">flow-conditional video discriminator</text>
  <text x="479" y="268" class="small">目标：4-step 视频质量 + 风格/运动兼容性</text>

  <rect x="849" y="125" width="335" height="170" rx="12" class="wan"/>
  <text x="876" y="160" class="label">Our Wan DMD2</text>
  <text x="876" y="190" class="body">视频：50 -> 8 -> 4 progressive DMD2</text>
  <text x="876" y="216" class="body">DMD2 distribution matching + GAN</text>
  <text x="876" y="242" class="body">batch 提升后 4-step from 8 可用</text>
  <text x="876" y="268" class="small">目标：Wan T2V 4-step 加速和物理一致性</text>

  <path d="M390 210 L452 210" class="arrow"/>
  <path d="M787 210 L849 210" class="arrow"/>

  <rect x="75" y="370" width="250" height="130" rx="10" class="warn"/>
  <text x="99" y="402" class="label">可借鉴 1</text>
  <text x="99" y="431" class="body">早期大步压缩可用 MSE/稳定目标</text>
  <text x="99" y="456" class="body">低步阶段加强 adversarial / GAN</text>
  <text x="99" y="481" class="small">对应：8-step 和 4-step 分阶段策略</text>

  <rect x="355" y="370" width="250" height="130" rx="10" class="warn"/>
  <text x="379" y="402" class="label">可借鉴 2</text>
  <text x="379" y="431" class="body">每个 step 数独立 checkpoint</text>
  <text x="379" y="456" class="body">4-step/8-step 各自训练和选择</text>
  <text x="379" y="481" class="small">对应：不要默认最后 checkpoint 最佳</text>

  <rect x="635" y="370" width="250" height="130" rx="10" class="warn"/>
  <text x="659" y="402" class="label">可借鉴 3</text>
  <text x="659" y="431" class="body">flow-conditional discriminator</text>
  <text x="659" y="456" class="body">给判别器输入前后轨迹位置</text>
  <text x="659" y="481" class="small">对应：减少物理/时序漂移</text>

  <rect x="915" y="370" width="250" height="130" rx="10" class="warn"/>
  <text x="939" y="402" class="label">可借鉴 4</text>
  <text x="939" y="431" class="body">大 batch + 梯度累积</text>
  <text x="939" y="456" class="body">多 timestep 判别器稳定训练</text>
  <text x="939" y="481" class="small">对应：解释 batch 提升后的质量恢复</text>
</svg>
